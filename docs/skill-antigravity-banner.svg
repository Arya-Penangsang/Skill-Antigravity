<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="640" cy="200" r="300" fill="#a855f7" opacity="0.15" filter="url(#blurFilter)" />
  <circle cx="340" cy="380" r="220" fill="#ef4444" opacity="0.12" filter="url(#blurFilter)" />
  <circle cx="940" cy="380" r="220" fill="#3b82f6" opacity="0.12" filter="url(#blurFilter)" />

  <!-- Subtle Cyber Hex Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100" />
    <line x1="0" y1="200" x2="1280" y2="200" />
    <line x1="0" y1="300" x2="1280" y2="300" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="500" x2="1280" y2="500" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Shield Icon Container -->
  <rect x="580" y="70" width="120" height="120" rx="30" fill="#180d2b" stroke="#a855f7" stroke-width="2.5" />
  <!-- Shield Vector -->
  <path d="M640 95 L680 110 C680 145 660 170 640 180 C620 170 600 145 600 110 Z" fill="none" stroke="#c084fc" stroke-width="4" stroke-linejoin="round" />
  <path d="M640 120 L640 155 M625 135 L655 135" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Main Title -->
  <text x="640" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="-1">
    Skill-<tspan fill="url(#cyber)">Antigravity</tspan>
  </text>

  <!-- Subtitle -->
  <text x="640" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#94a3b8">
    Complete Cybersecurity &amp; Threat Operations Suite for AI Agents
  </text>

  <!-- Capability Pills -->
  <g transform="translate(140, 375)">
    <!-- Pill 1: Red Team -->
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#1e131d" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fca5a5">⚔️ Red Teaming</text>

    <!-- Pill 2: Blue Team -->
    <rect x="200" y="0" width="180" height="40" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="290" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#93c5fd">🛡️ Blue Teaming</text>

    <!-- Pill 3: Purple Team -->
    <rect x="400" y="0" width="180" height="40" rx="20" fill="#1b122c" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="490" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#d8b4fe">🟣 Purple Team</text>

    <!-- Pill 4: DFIR -->
    <rect x="600" y="0" width="190" height="40" rx="20" fill="#061e24" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="695" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#67e8f9">🕵️ DFIR &amp; Sandbox</text>

    <!-- Pill 5: REA -->
    <rect x="810" y="0" width="190" height="40" rx="20" fill="#062117" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="905" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">🔬 Reverse Eng</text>
  </g>

  <!-- Standards & Frameworks -->
  <g transform="translate(640, 480)" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#64748b">
    <text x="0" y="0">
      MITRE ATT&amp;CK &nbsp;•&nbsp; NIST SP 800-86 / 800-115 &nbsp;•&nbsp; OWASP Top 10 &amp; ASVS &nbsp;•&nbsp; CEH v11 Aligned
    </text>
  </g>

  <!-- Footer Link -->
  <text x="640" y="550" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#a855f7" letter-spacing="1">
    github.com/Arya-Penangsang/Skill-Antigravity
  </text>
</svg>
